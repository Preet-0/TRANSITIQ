<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-labelledby="title desc">
<title id="title">Pip watches a planet cross a star</title><desc id="desc">A small space robot observes a planet transiting a glowing star. A light curve beneath the orbit shows the dip in brightness.</desc>
<style>@media(prefers-reduced-motion:reduce){animateMotion{display:none}}</style>
<defs><radialGradient id="star"><stop stop-color="#FFF4CF"/><stop offset=".55" stop-color="#F1C96A"/><stop offset="1" stop-color="#C68C43" stop-opacity="0"/></radialGradient><linearGradient id="pipbody" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F4F0E8"/><stop offset="1" stop-color="#AEBBC7"/></linearGradient><linearGradient id="lens" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#A2F0F3"/><stop offset="1" stop-color="#297F9A"/></linearGradient></defs>
<g fill="#F4F0E8" opacity=".75"><circle cx="92" cy="68" r="2"/><circle cx="552" cy="77" r="2"/><circle cx="629" cy="161" r="2"/><circle cx="383" cy="56" r="1.5"/><circle cx="62" cy="233" r="1.5"/><circle cx="586" cy="288" r="1.5"/><circle cx="291" cy="108" r="2"/><circle cx="662" cy="350" r="1.5"/></g>
<circle cx="399" cy="211" r="114" fill="url(#star)" opacity=".8"/><circle cx="399" cy="211" r="63" fill="#F1C96A"/><circle cx="399" cy="211" r="48" fill="#FFF0C4" opacity=".7"/>
<ellipse cx="399" cy="211" rx="176" ry="75" fill="none" stroke="#73CFE0" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="5 8"/>
<circle cx="259" cy="211" r="16" fill="#142238" stroke="#73CFE0" stroke-width="3"><animateMotion dur="12s" repeatCount="indefinite" path="M0 0 A140 75 0 1 0 280 0 A140 75 0 1 0 0 0"/></circle>
<g transform="translate(70 190)"><path d="M69 38V16" stroke="#F1C96A" stroke-width="5" stroke-linecap="round"/><path d="m69 5 4 8 8 1-6 6 1 9-7-4-8 4 2-9-7-6 9-1z" fill="#F1C96A"/><rect x="31" y="31" width="77" height="102" rx="32" fill="url(#pipbody)" stroke="#F4F0E8" stroke-width="3"/><path d="M21 59h22v35H21a13 13 0 0 1 0-35Zm75 0h21a13 13 0 0 1 0 35H96z" fill="#142238" stroke="#73CFE0" stroke-width="3"/><circle cx="70" cy="75" r="26" fill="#08111F" stroke="#F1C96A" stroke-width="4"/><circle cx="70" cy="75" r="19" fill="url(#lens)"/><circle cx="70" cy="75" r="9" fill="#102239"/><circle cx="77" cy="67" r="4" fill="#fff"/><path d="M55 116q15 10 30 0" fill="none" stroke="#244052" stroke-width="3" stroke-linecap="round"/><path d="M51 132v13m38-13v13" stroke="#F1C96A" stroke-width="5" stroke-linecap="round"/></g>
<path d="M239 153l-32 22" stroke="#73CFE0" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/><circle cx="208" cy="175" r="3" fill="#73CFE0"/>
<g transform="translate(278 345)"><rect width="356" height="118" rx="17" fill="#0D1728" stroke="#32445a"/><text x="22" y="27" fill="#B0BDCD" font-family="sans-serif" font-size="12" letter-spacing="2">STAR BRIGHTNESS</text><path d="M22 76h48l10-2 10 3h36l12-4 11 34 13 1 11-31 13-3h80l13-3 9 5h41" fill="none" stroke="#73CFE0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 91h312" stroke="#314259" stroke-width="1" stroke-dasharray="3 6"/><text x="22" y="105" fill="#8294a9" font-family="sans-serif" font-size="10">TIME →</text></g>
