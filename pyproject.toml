[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transitiq"
version = "0.1.0"
description = "Reproducible exoplanet transit detection and vetting"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "astropy==6.1.7",
  "lightkurve==2.5.1",
  "astroquery==0.4.9.post1",
  "streamlit==1.41.1",
  "plotly==5.24.1",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "reportlab==4.2.5",
  "requests==2.32.3",
  "urllib3==2.2.3",
  "chardet==5.2.0",
  "transitleastsquares==1.32",
  "setuptools==84.2.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "playwright==1.65.2"]

[tool.setuptools.packages.find]
include = ["transitiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
